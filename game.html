<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder Simulator</title>

    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Load React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- 3. Load Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }

        body {
            overscroll-behavior-y: contain;
        }

        .font-dos {
            font-family: 'Courier New', Courier, monospace;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }

        @keyframes explode {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0;
            }
        }

        .explosion {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fbbf24 0%, #ef4444 50%, #1f2937 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: explode 0.4s ease-out forwards;
            z-index: 100;
            box-shadow: 0 0 20px #ef4444;
        }

        /* Socket Styling */
        .socket-port {
            position: absolute;
            background-color: #1f2937;
            border: 1px solid #4b5563;
            transform: translate(-50%, -50%);
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 2px #000;
        }

        .socket-pins {
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#6b7280 20%, transparent 20%);
            background-size: 3px 3px;
        }

        .bg-win11 {
            background: radial-gradient(circle at 50% 120%, #60a5fa, #1e3a8a, #0f172a);
            background-size: cover;
        }

        /* Firework Animation */
        @keyframes firework {
            0% {
                transform: translate(var(--x), var(--initialY));
                width: var(--initialSize);
                opacity: 1;
            }

            50% {
                width: 0.5rem;
                opacity: 1;
            }

            100% {
                width: var(--finalSize);
                opacity: 0;
            }
        }

        .firework,
        .firework::before,
        .firework::after {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: firework 2s infinite ease-in-out;
        }

        .firework::before,
        .firework::after {
            content: '';
            display: block;
        }

        .fw-1 {
            animation: firework 2s infinite;
            box-shadow: 0 0 #fff, -20px -30px #ff0055, 20px -30px #ff0055, -30px 10px #ff0055, 30px 10px #ff0055, -10px 40px #ff0055, 10px 40px #ff0055;
        }

        .fw-2 {
            animation: firework 2.5s infinite 0.5s;
            box-shadow: 0 0 #fff, -20px -30px #00aaff, 20px -30px #00aaff, -30px 10px #00aaff, 30px 10px #00aaff, -10px 40px #00aaff, 10px 40px #00aaff;
        }

        .fw-3 {
            animation: firework 1.8s infinite 1s;
            box-shadow: 0 0 #fff, -20px -30px #ffdd00, 20px -30px #ffdd00, -30px 10px #ffdd00, 30px 10px #ffdd00, -10px 40px #ffdd00, 10px 40px #ffdd00;
        }

        @keyframes gradient-x {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .animate-rgb {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient-x 15s ease infinite;
        }
    </style>
</head>

<body class="bg-slate-100 transition-colors duration-500">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- GLOBAL SOUND STATE ---
        let GLOBAL_VOLUME = 0.5;

        // --- SOUND MANAGER ---
        const playSound = (type) => {
            try {
                if (GLOBAL_VOLUME <= 0) return;

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;

                const masterGain = ctx.createGain();
                masterGain.gain.value = GLOBAL_VOLUME;
                masterGain.connect(ctx.destination);

                if (type === 'click') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(masterGain);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'eat' || type === 'correct') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(masterGain);
                    osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'crash' || type === 'wrong') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(masterGain);
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'success') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(masterGain);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(500, now); osc.frequency.linearRampToValueAtTime(1000, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                } else if (type === 'error') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    const bufferSize = ctx.sampleRate * 0.5; const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource(); noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000;
                    noise.connect(filter); filter.connect(gain); gain.connect(masterGain);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    noise.start(now); noise.stop(now + 0.5);
                } else if (type === 'boot') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(masterGain);
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, now); osc.frequency.linearRampToValueAtTime(100, now + 2);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 2);
                    osc.start(now); osc.stop(now + 2);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.connect(gain); gain.connect(masterGain);
                        const startTime = now + (i * 0.15);
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, startTime);
                        gain.gain.setValueAtTime(0, startTime); gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
                        osc.start(startTime); osc.stop(startTime + 0.5);
                    });
                }
            } catch (e) { console.error("Audio Error", e); }
        };

        // --- SNAKE GAME COMPONENT ---
        const SnakeGame = ({ onClose }) => {
            const GRID_SIZE = 20;
            const CELL_SIZE = 15;
            const [snake, setSnake] = useState([{ x: 5, y: 5 }]);
            const [food, setFood] = useState({ x: 10, y: 10 });
            const [dir, setDir] = useState({ x: 1, y: 0 });
            const [score, setScore] = useState(0);
            const [gameOver, setGameOver] = useState(false);

            const spawnFood = () => {
                return {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            };

            useEffect(() => {
                const handleKey = (e) => {
                    switch (e.key) {
                        case 'ArrowUp': if (dir.y === 0) setDir({ x: 0, y: -1 }); break;
                        case 'ArrowDown': if (dir.y === 0) setDir({ x: 0, y: 1 }); break;
                        case 'ArrowLeft': if (dir.x === 0) setDir({ x: -1, y: 0 }); break;
                        case 'ArrowRight': if (dir.x === 0) setDir({ x: 1, y: 0 }); break;
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [dir]);

            useEffect(() => {
                if (gameOver) return;
                const moveSnake = setInterval(() => {
                    setSnake((prev) => {
                        const newHead = { x: prev[0].x + dir.x, y: prev[0].y + dir.y };
                        if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                            setGameOver(true);
                            playSound('crash');
                            return prev;
                        }
                        if (prev.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
                            setGameOver(true);
                            playSound('crash');
                            return prev;
                        }
                        const newSnake = [newHead, ...prev];
                        if (newHead.x === food.x && newHead.y === food.y) {
                            setScore(s => s + 1);
                            setFood(spawnFood());
                            playSound('eat');
                        } else {
                            newSnake.pop();
                        }
                        return newSnake;
                    });
                }, 150);
                return () => clearInterval(moveSnake);
            }, [dir, food, gameOver]);

            const restart = () => {
                setSnake([{ x: 5, y: 5 }]);
                setFood(spawnFood());
                setDir({ x: 1, y: 0 });
                setScore(0);
                setGameOver(false);
            }

            return (
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-lg shadow-2xl w-[340px] border border-gray-300 overflow-hidden z-50 flex flex-col font-sans animate-in zoom-in duration-200">

                            <div className="absolute bg-red-500 rounded-full" style={{ width: CELL_SIZE - 2, height: CELL_SIZE - 2, left: food.x * CELL_SIZE + 1, top: food.y * CELL_SIZE + 1 }}></div>
                            {snake.map((seg, i) => (
                                <div key={i} className="absolute bg-green-500" style={{ width: CELL_SIZE - 1, height: CELL_SIZE - 1, left: seg.x * CELL_SIZE, top: seg.y * CELL_SIZE }}></div>
                            ))}
                            {gameOver && (
                                <div className="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-white">
                                    <div className="text-red-500 font-bold text-xl mb-2">GAME OVER</div>
                                    <button onClick={restart} className="px-3 py-1 bg-white text-black text-xs font-bold rounded hover:bg-gray-200">RETRY</button>
                                </div>
                            )}
                        </div>

                    </div>

        };

        // --- QUIZ GAME COMPONENT ---
        const QuizGame = ({ onClose, onFinish }) => {
            const questions = [
                { q: "CPU คืออุปกรณ์ส่วนใดของคอมพิวเตอร์?", options: ["หน่วยประมวลผลกลาง", "หน่วยความจำ", "อุปกรณ์แสดงผล", "อุปกรณ์เก็บข้อมูล"], a: 0 },
                { q: "RAM ย่อมาจากอะไร?", options: ["Read Access Memory", "Random Access Memory", "Run All Memory", "Read All Module"], a: 1 },

                { q: "หน้าที่หลักของ Power Supply คืออะไร?", options: ["ประมวลผลภาพ", "เก็บข้อมูล", "ระบายความร้อน", "จ่ายกระแสไฟฟ้า"], a: 3 },

                { q: "Windows 11 จัดเป็นซอฟต์แวร์ประเภทใด?", options: ["Utility", "Application", "Operating System (OS)", "Antivirus"], a: 2 },
                { q: "BIOS ย่อมาจากอะไร?", options: ["Basic Input Output System", "Binary Input Operating System", "Base Internal Operating Software", "Basic Interface On System"], a: 0 },

            const handleAnswer = (index) => {

            return (
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-lg shadow-2xl w-[450px] border border-gray-300 overflow-hidden z-50 flex flex-col font-sans animate-in zoom-in duration-200">

                                </div>
                                <div className="grid gap-3 mt-auto">

                                </div>
                                <div>
                                    <h2 className="text-2xl font-bold text-gray-800">ทำแบบทดสอบเสร็จสิ้น!</h2>
                                    <p className="text-gray-600 mt-2">คะแนนของคุณคือ</p>

        // --- OS SIMULATOR COMPONENT ---
        const OSSimulator = ({ build, userName, onComplete }) => {
            const [step, setStep] = useState('off');
            const [usbInserted, setUsbInserted] = useState(false);
            const [progress, setProgress] = useState(0);
            const [selectedDrive, setSelectedDrive] = useState(null);
            const [openedApp, setOpenedApp] = useState(null); // 'snake', 'quiz'
            const [showCongrats, setShowCongrats] = useState(false);

            const cpuName = PARTS_DATA.cpu.find(c => c.id === build.cpu)?.name || "Unknown CPU";
            const ramName = PARTS_DATA.ram.find(r => r.id === build.ram)?.name || "Unknown RAM";
            const storageList = ['hdd1', 'hdd2', 'm2'].filter(k => build[k]).map(k => ({
                key: k,
                name: PARTS_DATA.storage.find(s => s.id === build[k])?.name
            }));

            const handlePowerOn = () => {
                playSound('click');
                if (!usbInserted) {
                    alert("กรุณาเสียบ USB Flash Drive (Windows Installer) ก่อนเปิดเครื่อง");
                    return;
                }
                playSound('boot');
                setStep('bios');
                setTimeout(() => setStep('boot_usb'), 4000);
            };

            const toggleUsb = () => {
                playSound('click');
                setUsbInserted(!usbInserted);
            };

            useEffect(() => {
                if (step === 'boot_usb') {
                    const timer = setTimeout(() => {
                        setStep('boot_usb_ready');
                    }, 4000);
                    return () => clearTimeout(timer);
                }
            }, [step]);

            const handleInstallStart = () => {
                playSound('click');
                setStep('drive_select');
            };

            const handleDriveSelect = (key) => {
                playSound('click');
                setSelectedDrive(key);
                setStep('installing');
            };

            useEffect(() => {
                if (step === 'installing') {
                    const timer = setInterval(() => {
                        setProgress(prev => {
                            if (prev >= 100) {
                                clearInterval(timer);
                                setStep('restarting');
                                setTimeout(() => setStep('desktop'), 3000);
                                return 100;
                            }
                            return prev + 1;
                        });
                    }, 50);
                    return () => clearInterval(timer);
                }
            }, [step]);

            // Trigger Win sound on desktop load
            useEffect(() => {
                if (step === 'desktop') {
                    playSound('win');
                }
            }, [step]);

            return (
                <div className="w-full h-[500px] bg-gray-900 rounded-xl border-8 border-gray-700 relative overflow-hidden flex flex-col items-center justify-center shadow-2xl">
                    <div className="absolute bottom-2 text-gray-500 font-bold text-xs tracking-widest">GEMINI MONITOR</div>
                    {step === 'off' && (

                            <div className="text-gray-500 font-dos">NO SIGNAL</div>
                            <div className="flex gap-4 justify-center">

                            </div>

                            <div>Memory : {ramName} OK</div>

                            <br />
                            <div className="mt-8">Booting from USB Device<span className="blink">_</span></div>
                        </div>
                    )}

                                    <div className="w-8 h-8 hover:bg-white/50 rounded flex items-center justify-center transition duration-200 cursor-pointer"><div className="bg-yellow-400 w-5 h-4 rounded-sm border-b-2 border-yellow-600 shadow-sm relative"><div className="bg-blue-300 w-5 h-1 absolute -top-1 left-0 rounded-t-sm"></div></div></div>

        // --- 2D Visualizer Component ---
        const PCVisualizer = ({ build, cableStatus, onConnectCable, isCablingMode, theme }) => {
            const containerRef = useRef(null);
            const [dragState, setDragState] = useState(null);
            const [explosion, setExplosion] = useState(null);

            const caseData = PARTS_DATA.case.find(c => c.id === build.case) || PARTS_DATA.case[0];
            const mbData = PARTS_DATA.motherboard.find(m => m.id === build.motherboard);
            const cpuData = PARTS_DATA.cpu.find(c => c.id === build.cpu);
            const gpuData = PARTS_DATA.gpu.find(g => g.id === build.gpu);
            const psuData = PARTS_DATA.psu.find(p => p.id === build.psu);
            const hdd1Data = PARTS_DATA.storage.find(s => s.id === build.hdd1);
            const hdd2Data = PARTS_DATA.storage.find(s => s.id === build.hdd2);
            const ramData = PARTS_DATA.ram.find(r => r.id === build.ram);

            const hasPsu = !!psuData;
            const hasMb = !!mbData;

            const cablesConfig = [
                { id: 'atx24', label: '24-Pin Power', required: hasMb, source: { x: 50, y: 90 }, target: { x: mbData?.size === 'E-ATX' ? 88 : 80, y: 40 } },
                { id: 'eps8', label: '8-Pin CPU', required: hasMb, source: { x: 40, y: 90 }, target: { x: 22, y: 12 } },
                { id: 'gpuPcie', label: 'PCIe Power', required: !!(gpuData && gpuData.id !== 'gpu0'), source: { x: 60, y: 90 }, target: { x: 40 + (gpuData?.length || 0) * 10, y: 60 } },
                { id: 'frontPanel', label: 'Front Panel', required: hasMb, source: { x: 95, y: 80 }, target: { x: 80, y: 85 } },
                { id: 'sata1', label: 'SATA Data 1', required: !!hdd1Data, source: { x: 85, y: 65 }, target: { x: 90, y: 80 } },
                { id: 'sata2', label: 'SATA Data 2', required: !!hdd2Data, source: { x: 85, y: 70 }, target: { x: 90, y: 95 } }
            ];

            const handleDragStart = (e, cableId) => {
                playSound('click');
                if (cableStatus[cableId]) return;
                if (e.type === 'touchstart') document.body.style.overflow = 'hidden';
                if (containerRef.current) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    setDragState({ cableId, x: clientX - rect.left, y: clientY - rect.top });
                }
            };
            const handleDragMove = (e) => {
                if (!dragState || !containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                setDragState(prev => ({ ...prev, x: clientX - rect.left, y: clientY - rect.top }));
            };
            const handleDragEnd = (e) => {
                if (!dragState) return;
                if (e.type === 'touchend') document.body.style.overflow = '';

                const cable = cablesConfig.find(c => c.id === dragState.cableId);

                if (cable && containerRef.current) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const currentXPercent = (dragState.x / rect.width) * 100;
                    const currentYPercent = (dragState.y / rect.height) * 100;

                    const dist = Math.sqrt(Math.pow(currentXPercent - cable.target.x, 2) + Math.pow(currentYPercent - cable.target.y, 2));
                    if (dist < 10) {
                        playSound('success');
                        onConnectCable(cable.id);
                    } else {
                        const wrongTarget = cablesConfig.find(c => {
                            if (c.id === cable.id || !c.required) return false;
                            const d = Math.sqrt(Math.pow(currentXPercent - c.target.x, 2) + Math.pow(currentYPercent - c.target.y, 2));
                            return d < 10;
                        });

                        if (wrongTarget) {
                            playSound('error');
                            setExplosion({ x: dragState.x, y: dragState.y });
                            setTimeout(() => setExplosion(null), 500);
                        }
                    }
                }
                setDragState(null);
            };

            useEffect(() => {
                if (dragState) {
                    window.addEventListener('mousemove', handleDragMove);
                    window.addEventListener('mouseup', handleDragEnd);
                    window.addEventListener('touchmove', handleDragMove, { passive: false });
                    window.addEventListener('touchend', handleDragEnd);
                }
                return () => {
                    window.removeEventListener('mousemove', handleDragMove);
                    window.removeEventListener('mouseup', handleDragEnd);
                    window.removeEventListener('touchmove', handleDragMove);
                    window.removeEventListener('touchend', handleDragEnd);
                };
            }, [dragState]);

            const getPixelCoords = (percentCoords) => {
                if (!containerRef.current) return { x: 0, y: 0 };
                return { x: (percentCoords.x / 100) * containerRef.current.clientWidth, y: (percentCoords.y / 100) * containerRef.current.clientHeight };
            };

            const containerStyle = {
                backgroundColor: caseData.color,
                borderColor: caseData.borderColor
            };
            const mbStyle = mbData ? { backgroundColor: mbData.color, width: mbData.size === 'mATX' ? '65%' : (mbData.size === 'E-ATX' ? '85%' : '75%'), height: mbData.size === 'mATX' ? '65%' : '80%' } : { backgroundColor: '#2d3748', width: '75%', height: '80%' };

            return (
                <div ref={containerRef} className={`relative w-full h-[400px] md:h-[500px] border-[12px] rounded-xl shadow-2xl overflow-hidden transition-all duration-500 bg-gray-100 flex flex-col select-none touch-none ${theme === 'matrix' ? 'border-green-800' : ''}`} style={containerStyle}>
                    <div className="absolute inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#444 1px, transparent 1px)', backgroundSize: '10px 10px' }}></div>
                    {explosion && <div className="explosion" style={{ left: explosion.x, top: explosion.y }}></div>}

                    {/* VISIBLE SOCKETS (Always visible in cabling mode) */}
                    {isCablingMode && cablesConfig.map(cable => {
                        if (!cable.required) return null;
                        const w = cable.id === 'atx24' ? '12px' : cable.id.includes('sata') ? '20px' : '16px';
                        const h = cable.id === 'atx24' ? '40px' : '12px';
                        return (
                            <div
                                key={`socket-${cable.id}`}
                                className="socket-port"
                                style={{ left: `${cable.target.x}%`, top: `${cable.target.y}%`, width: w, height: h }}
                                title={`เสียบสาย ${cable.label} ที่นี่`}
                            >
                                <div className="socket-pins"></div>
                            </div>
                        );
                    })}

                    {hasPsu && (
                        <svg className="absolute inset-0 w-full h-full z-30 pointer-events-none overflow-visible">
                            {cablesConfig.map(cable => {
                                if (!cable.required) return null;
                                const isConnected = cableStatus[cable.id];
                                const isDragging = dragState?.cableId === cable.id;
                                const startPx = getPixelCoords(cable.source);
                                const targetPx = getPixelCoords(cable.target);
                                let endPx = isConnected ? targetPx : startPx;
                                if (isDragging) endPx = { x: dragState.x, y: dragState.y };
                                else if (!isConnected) endPx = { x: startPx.x, y: startPx.y - 20 };
                                return <CableConnector key={cable.id} id={cable.id} label={cable.label} isConnected={isConnected} startPos={startPx} endPos={endPx} targetPos={targetPx} onDragStart={handleDragStart} />;
                            })}
                        </svg>
                    )}
                    {dragState && (
                        <>
                            {cablesConfig.map(cable => {
                                if (cable.id === dragState.cableId) return <TargetZone key={cable.id} x={cable.target.x} y={cable.target.y} active={true} label={cable.label} />;
                                return null;
                            })}
                        </>
                    )}
                    <div className="flex-grow relative p-4 z-10 pointer-events-none">
                        <div className="absolute top-8 left-16 transition-all duration-300 rounded-md border border-white/10 shadow-lg flex flex-col p-2 pointer-events-auto" style={mbStyle}>
                            <span className="text-[8px] text-white/50 absolute bottom-1 right-2">{mbData?.size || 'NO MB'}</span>
                            <div className="absolute top-[20%] left-1/2 -translate-x-1/2 w-20 h-20 md:w-24 md:h-24 bg-gray-300/10 border border-gray-400/50 rounded flex items-center justify-center">
                                {cpuData ? <div className="relative w-16 h-16 md:w-20 md:h-20 bg-gray-800 rounded-full flex items-center justify-center border-4 border-gray-600 shadow-md"><div className="w-8 h-8 rounded-full" style={{ backgroundColor: cpuData.color }}></div></div> : <span className="text-[10px] text-white/40">CPU Socket</span>}
                            </div>
                            <div className="absolute top-[20%] right-4 flex gap-1 h-20">
                                {[0, 1, 2, 3].map(i => {
                                    const isInstalled = ramData && i < ramData.count;
                                    return <div key={i} className={`w-2 h-full border border-gray-600 rounded-sm ${isInstalled ? 'bg-green-600' : 'bg-black/40'}`}></div>;
                                })}
                            </div>
                            {gpuData && gpuData.id !== 'gpu0' && (
                                <div className="absolute top-[55%] left-0 h-12 bg-gray-800 border-2 border-gray-600 rounded-r-lg shadow-xl z-20 flex items-center px-2" style={{ width: `${40 + (gpuData.length * 15)}%`, background: `linear-gradient(90deg, #2d3748 0%, ${gpuData.color} 100%)` }}>
                                    <span className="text-[10px] text-white truncate">{gpuData.name}</span>
                                </div>
                            )}
                        </div>
                        {hdd1Data && <div className="absolute bottom-24 right-4 w-16 h-20 bg-gray-800 border-2 border-gray-500 rounded flex flex-col items-center justify-center pointer-events-auto"><span className="text-[8px] text-white">SATA 1</span></div>}
                        {hdd2Data && <div className="absolute bottom-2 right-4 w-16 h-20 bg-gray-800 border-2 border-gray-500 rounded flex flex-col items-center justify-center pointer-events-auto"><span className="text-[8px] text-white">SATA 2</span></div>}
                    </div>
                    <div className="h-24 w-full bg-gray-900 border-t-4 border-gray-700 relative flex items-center justify-center z-20 pointer-events-auto">
                        {psuData && <div className="w-1/2 h-full absolute left-0 flex items-center justify-center border-r border-gray-700" style={{ backgroundColor: psuData.color }}><div className="flex flex-col items-center"><Zap className="text-white" /><span className="text-xs font-bold text-white mt-1">{psuData.name}</span></div></div>}
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        function PCBuilderGame() {
            const [gameState, setGameState] = useState('building');
            const [mode, setMode] = useState('parts'); // parts, cables, os
            const [userInfo, setUserInfo] = useState({ name: 'นักเรียน', surname: '', room: '-' });
            const [build, setBuild] = useState({});
            const [cableStatus, setCableStatus] = useState({});
            const [totalPrice, setTotalPrice] = useState(0);

            // --- Settings State ---
            const [volume, setVolume] = useState(0.5);
            const [theme, setTheme] = useState('light');
            const [showSettings, setShowSettings] = useState(false);

            // Hide loading screen & read session from Parent
            useEffect(() => {
                const loader = document.getElementById('loading');
                if (loader) loader.style.display = 'none';

                try {
                    const session = JSON.parse(localStorage.getItem('edutoken_session'));
                    if (session) {
                        setUserInfo({ name: session.firstName || 'นักเรียน', surname: session.lastName || '', room: session.room || '-' });
                    }
                } catch (e) { }
            }, []);

            // Update Global Volume
            useEffect(() => {
                GLOBAL_VOLUME = volume;
            }, [volume]);

            useEffect(() => {
                let total = 0;
                Object.keys(build).forEach(key => {
                    const partId = build[key];
                    const category = CATEGORY_MAP[key];
                    if (category && PARTS_DATA[category]) {
                        const part = PARTS_DATA[category].find(p => p.id === partId);
                        if (part) total += part.price;
                    }
                });
                setTotalPrice(total);
            }, [build]);

            const handleStart = (e) => {
                e.preventDefault();
                playSound('click');
                if (userInfo.name && userInfo.surname && userInfo.room) {
                    setGameState('building');
                } else {
                    alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                }
            };

            const handleSelectPart = (key, id) => {
                playSound('click');
                let nextBuild = { ...build, [key]: id };
                let resetMessage = null;

                if (key === 'cpu') {
                    const newCpu = PARTS_DATA.cpu.find(c => c.id === id);
                    const currentMobo = PARTS_DATA.motherboard.find(m => m.id === build.motherboard);
                    if (currentMobo && currentMobo.socket !== newCpu.socket) {
                        nextBuild.motherboard = null;
                        nextBuild.ram = null;
                        resetMessage = `เปลี่ยน CPU เป็น ${newCpu.socket} ระบบได้นำเมนบอร์ดเดิมออก กรุณาเลือกใหม่`;
                    }
                }

                if (key === 'motherboard') {
                    const newMobo = PARTS_DATA.motherboard.find(m => m.id === id);
                    const currentRam = PARTS_DATA.ram.find(r => r.id === build.ram);
                    if (currentRam && currentRam.type !== newMobo.ramType) {
                        nextBuild.ram = null;
                        resetMessage = `เปลี่ยนเมนบอร์ดเป็น ${newMobo.ramType} ระบบได้นำแรมเดิมออก กรุณาเลือกใหม่`;
                    }
                }

                setBuild(nextBuild);
                if (resetMessage) alert(resetMessage);
            };

            const checkCompatibility = (category, part) => {
                if (category === 'motherboard' && build.cpu) {
                    const selectedCpu = PARTS_DATA.cpu.find(c => c.id === build.cpu);
                    if (selectedCpu && part.socket !== selectedCpu.socket) return { compatible: false, reason: `ต้องใช้เมนบอร์ด Socket ${selectedCpu.socket}` };
                }
                if (category === 'cpu' && build.motherboard) {
                    const selectedMobo = PARTS_DATA.motherboard.find(m => m.id === build.motherboard);
                    if (selectedMobo && part.socket !== selectedMobo.socket) return { compatible: false, reason: `เมนบอร์ดปัจจุบันรองรับ Socket ${selectedMobo.socket}` };
                }
                if (category === 'ram' && build.motherboard) {
                    const selectedMobo = PARTS_DATA.motherboard.find(m => m.id === build.motherboard);
                    if (selectedMobo && part.type !== selectedMobo.ramType) return { compatible: false, reason: `เมนบอร์ดรองรับแรม ${selectedMobo.ramType} เท่านั้น` };
                }
                return { compatible: true };
            };

            const handleConnectCable = (cableId) => {
                setCableStatus(prev => ({ ...prev, [cableId]: true }));
            };

            const handleModeChange = (newMode) => {
                playSound('click');
                if (newMode === 'os') {
                    const requiredCables = ['atx24', 'eps8', 'frontPanel'];
                    if (build.gpu && build.gpu !== 'gpu0') requiredCables.push('gpuPcie');
                    if (build.hdd1) requiredCables.push('sata1');
                    if (build.hdd2) requiredCables.push('sata2');

                    const missingCables = requiredCables.filter(c => !cableStatus[c]);
                    if (missingCables.length > 0) {
                        alert(`กรุณาต่อสายไฟให้ครบก่อนลง Windows ครับ\nสายที่ขาด: ${missingCables.join(', ')}`);
                        return;
                    }
                    const hasStorage = build.hdd1 || build.hdd2 || build.m2;
                    if (!hasStorage) {
                        alert('ไม่พบฮาร์ดดิสก์! กรุณาติดตั้ง Storage ก่อนลง Windows');
                        return;
                    }
                }
                setMode(newMode);
            };

            const handleFinishGame = () => {
                playSound('success');
                setGameState('summary');
                try {
                    let messageSent = false;
                    const msg = { type: 'ADD_TOKEN', amount: 10 };
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage(msg, '*');
                        messageSent = true;
                    }
                    if (window.parent && window.parent.parent && window.parent.parent !== window) {
                        window.parent.parent.postMessage(msg, '*');
                        messageSent = true;
                    }
                    if (window.top && window.top !== window) {
                        window.top.postMessage(msg, '*');
                        messageSent = true;
                    }
                } catch (e) { 
                    console.error("Token PostMessage Error: ", e);
                }
            };

            const resetGame = () => {
                playSound('click');
                setBuild({});
                setCableStatus({});
                setMode('parts');
                setGameState('building');
                // Keep userInfo intact from session
            };

            // --- Theme Helper ---
            const getThemeClass = () => {
                switch (theme) {
                    case 'dark': return 'bg-slate-900 text-white';
                    case 'rgb': return 'bg-slate-800 text-white animate-rgb';
                    case 'matrix': return 'bg-black text-green-400 font-mono';
                    default: return 'bg-slate-100 text-slate-900';
                }
            };
            const getCardClass = () => {
                if (theme === 'dark' || theme === 'rgb') return 'bg-slate-800 border-slate-700 text-white';
                if (theme === 'matrix') return 'bg-black border-green-700 text-green-400 shadow-none border';
                return 'bg-white border-gray-100 text-gray-800';
            };

            // --- Render Sections ---
            if (gameState === 'intro') {
                return (
                    <div className={`min-h-screen flex items-center justify-center p-4 font-sans transition-colors duration-500 ${getThemeClass()}`}>
                        <div className={`p-8 rounded-2xl shadow-2xl max-w-md w-full ${getCardClass()}`}>
                            <div className="text-center mb-6">
                                <Monitor className={`w-16 h-16 mx-auto mb-2 ${theme === 'matrix' ? 'text-green-500' : 'text-blue-600'}`} />
                                <h1 className="text-3xl font-bold">PC Builder Simulator</h1>
                                <p className="opacity-70">เกมจำลองประกอบคอมพิวเตอร์</p>
                            </div>
                            <form onSubmit={handleStart} className="space-y-4">
                                <input type="text" required className={`block w-full px-3 py-2 border rounded ${theme === 'matrix' ? 'bg-black border-green-600 text-green-400' : 'bg-white border-gray-300'}`} placeholder="ชื่อจริง" value={userInfo.name} onChange={e => setUserInfo({ ...userInfo, name: e.target.value })} />
                                <input type="text" required className={`block w-full px-3 py-2 border rounded ${theme === 'matrix' ? 'bg-black border-green-600 text-green-400' : 'bg-white border-gray-300'}`} placeholder="นามสกุล" value={userInfo.surname} onChange={e => setUserInfo({ ...userInfo, surname: e.target.value })} />
                                <select required className={`block w-full px-3 py-2 border rounded ${theme === 'matrix' ? 'bg-black border-green-600 text-green-400' : 'bg-white border-gray-300'}`} value={userInfo.room} onChange={e => setUserInfo({ ...userInfo, room: e.target.value })}>
                                    <option value="">-- เลือกห้อง --</option>
                                    <option value="ปวช.2/5">ปวช.2/5</option>
                                    <option value="ปวช.2/6">ปวช.2/6</option>
                                    <option value="ปวช.2/7">ปวช.2/7</option>
                                </select>
                                <button type="submit" className={`w-full py-3 rounded font-bold transition-all ${theme === 'matrix' ? 'bg-green-700 hover:bg-green-600 text-black' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>เริ่มประกอบคอม</button>
                            </form>
                        </div>

                        {/* Settings Button on Intro */}
                        <div className="absolute top-4 right-4">
                            <button onClick={() => setShowSettings(!showSettings)} className="p-2 rounded-full hover:bg-black/10 transition">
                                <Settings className={theme === 'matrix' ? 'text-green-500' : 'text-gray-600'} />
                            </button>
                            {showSettings && (
                                <div className={`absolute top-12 right-0 p-4 rounded-xl shadow-xl w-64 z-50 border ${getCardClass()}`}>
                                    <div className="mb-4">
                                        <label className="text-xs font-bold uppercase mb-2 block opacity-70">Volume ({Math.round(volume * 100)}%)</label>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => setVolume(Math.max(0, parseFloat((volume - 0.1).toFixed(1))))} className="p-1 rounded hover:opacity-70"><Minus size={16} /></button>
                                            <div className="flex-grow h-2 bg-gray-200 rounded-full overflow-hidden">
                                                <div className={`h-full ${theme === 'matrix' ? 'bg-green-500' : 'bg-blue-500'}`} style={{ width: `${volume * 100}%` }}></div>
                                            </div>
                                            <button onClick={() => setVolume(Math.min(1, parseFloat((volume + 0.1).toFixed(1))))} className="p-1 rounded hover:opacity-70"><Plus size={16} /></button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold uppercase mb-2 block opacity-70">Theme</label>
                                        <div className="grid grid-cols-4 gap-2">
                                            <button onClick={() => setTheme('light')} className={`p-2 rounded border flex justify-center items-center h-10 ${theme === 'light' ? 'ring-2 ring-blue-500' : 'bg-gray-100 text-black'}`} title="Light"><Sun size={16} /></button>
                                            <button onClick={() => setTheme('dark')} className={`p-2 rounded border flex justify-center items-center h-10 bg-slate-900 text-white ${theme === 'dark' ? 'ring-2 ring-blue-500' : ''}`} title="Dark"><Moon size={16} /></button>
                                            <button onClick={() => setTheme('rgb')} className={`p-2 rounded border flex justify-center items-center h-10 bg-gradient-to-r from-pink-500 to-yellow-500 text-white ${theme === 'rgb' ? 'ring-2 ring-blue-500' : ''}`} title="RGB"><Palette size={16} /></button>
                                            <button onClick={() => setTheme('matrix')} className={`p-2 rounded border flex justify-center items-center h-10 bg-black text-green-500 ${theme === 'matrix' ? 'ring-2 ring-green-500' : ''}`} title="Matrix"><Terminal size={16} /></button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (gameState === 'summary') {
                return (
                    <div className={`min-h-screen py-10 px-4 font-sans transition-colors duration-500 ${getThemeClass()}`}>
                        <div className={`max-w-3xl mx-auto rounded-xl shadow-xl overflow-hidden ${getCardClass()}`}>
                            <div className={`p-6 text-center ${theme === 'matrix' ? 'bg-green-900 text-green-200' : 'bg-green-600 text-white'}`}>
                                <CheckCircle className="w-16 h-16 mx-auto mb-2" />
                                <h2 className="text-3xl font-bold">ประกอบสำเร็จ!</h2>
                            </div>
                            <div className="p-8">
                                <h3 className="text-xl font-bold">ผู้ประกอบ: {userInfo.name} {userInfo.surname}</h3>
                                <p className="opacity-70 mb-4">ห้อง: {userInfo.room}</p>
                                <div className="text-right mb-4"><p className={`text-3xl font-bold ${theme === 'matrix' ? 'text-green-400' : 'text-blue-600'}`}>฿{totalPrice.toLocaleString()}</p></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.entries(build).map(([key, id]) => {
                                        const category = CATEGORY_MAP[key];
                                        const part = PARTS_DATA[category]?.find(p => p.id === id);
                                        if (!part) return null;
                                        return <div key={key} className={`p-3 rounded border flex justify-between ${theme === 'dark' || theme === 'rgb' ? 'bg-white/5 border-white/10' : theme === 'matrix' ? 'border-green-800' : 'bg-gray-50 border-gray-200'}`}><span>{key}</span><span className="font-bold">{part.name}</span></div>;
                                    })}
                                </div>
                                <div className="mt-8 flex justify-center">
                                    <button onClick={resetGame} className={`px-6 py-3 rounded flex gap-2 ${theme === 'matrix' ? 'bg-green-800 text-black hover:bg-green-700' : 'bg-gray-800 text-white hover:bg-gray-900'}`}><RotateCcw /> ประกอบเครื่องใหม่</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const partCategories = [
                { key: 'cpu', label: 'ซีพียู (CPU)', icon: <Cpu size={18} />, source: 'cpu' },
                { key: 'motherboard', label: 'เมนบอร์ด', icon: <Smartphone size={18} />, source: 'motherboard' },
                { key: 'ram', label: 'แรม (RAM)', icon: <Monitor size={18} />, source: 'ram' },
                { key: 'gpu', label: 'การ์ดจอ (GPU)', icon: <Monitor size={18} />, source: 'gpu' },
                { key: 'hdd1', label: 'HDD SATA 1', icon: <HardDrive size={18} />, source: 'storage', filter: p => p.type === 'sata' },
                { key: 'hdd2', label: 'HDD SATA 2', icon: <HardDrive size={18} />, source: 'storage', filter: p => p.type === 'sata' },
                { key: 'm2', label: 'Nvme M.2', icon: <HardDrive size={18} />, source: 'storage', filter: p => p.type === 'm2' },
                { key: 'psu', label: 'Power Supply', icon: <Zap size={18} />, source: 'psu' },
                { key: 'case', label: 'เคส (Case)', icon: <Box size={18} />, source: 'case' },
            ];

            return (
                <div className={`min-h-screen font-sans flex flex-col transition-colors duration-500 ${getThemeClass()}`}>
                    <header className={`shadow-sm p-4 sticky top-0 z-30 transition-colors duration-500 ${getCardClass()}`}>
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <Monitor className={theme === 'matrix' ? 'text-green-500' : 'text-blue-600'} />
                                <span className="font-bold text-lg hidden sm:block">PC Builder Room {userInfo.room}</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right">
                                    <div className="text-xs opacity-70">งบประมาณ</div>
                                    <div className={`font-bold text-xl ${theme === 'matrix' ? 'text-green-400' : 'text-blue-600'}`}>฿{totalPrice.toLocaleString()}</div>
                                </div>
                                <button disabled={true} className="bg-gray-400 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow cursor-not-allowed">
                                    <span className="hidden sm:inline">...</span>
                                </button>

                                {/* Settings Toggle */}
                                <div className="relative">
                                    <button onClick={() => setShowSettings(!showSettings)} className={`p-2 rounded-full transition ${theme === 'light' ? 'hover:bg-gray-100' : 'hover:bg-white/10'}`}>
                                        <Settings />
                                    </button>

                                    {showSettings && (
                                        <div className={`absolute top-12 right-0 p-4 rounded-xl shadow-xl w-64 z-50 border ${getCardClass()}`}>
                                            <div className="mb-4">
                                                <label className="text-xs font-bold uppercase mb-2 block opacity-70">Volume ({Math.round(volume * 100)}%)</label>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => setVolume(Math.max(0, parseFloat((volume - 0.1).toFixed(1))))} className="p-1 rounded hover:opacity-70"><Minus size={16} /></button>
                                                    <div className="flex-grow h-2 bg-gray-200 rounded-full overflow-hidden">
                                                        <div className={`h-full ${theme === 'matrix' ? 'bg-green-500' : 'bg-blue-500'}`} style={{ width: `${volume * 100}%` }}></div>
                                                    </div>
                                                    <button onClick={() => setVolume(Math.min(1, parseFloat((volume + 0.1).toFixed(1))))} className="p-1 rounded hover:opacity-70"><Plus size={16} /></button>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold uppercase mb-2 block opacity-70">Theme</label>
                                                <div className="grid grid-cols-4 gap-2">
                                                    <button onClick={() => setTheme('light')} className={`p-2 rounded border flex justify-center items-center h-10 ${theme === 'light' ? 'ring-2 ring-blue-500' : 'bg-gray-100 text-black'}`} title="Light"><Sun size={16} /></button>
                                                    <button onClick={() => setTheme('dark')} className={`p-2 rounded border flex justify-center items-center h-10 bg-slate-900 text-white ${theme === 'dark' ? 'ring-2 ring-blue-500' : ''}`} title="Dark"><Moon size={16} /></button>
                                                    <button onClick={() => setTheme('rgb')} className={`p-2 rounded border flex justify-center items-center h-10 bg-gradient-to-r from-pink-500 to-yellow-500 text-white ${theme === 'rgb' ? 'ring-2 ring-blue-500' : ''}`} title="RGB"><Palette size={16} /></button>
                                                    <button onClick={() => setTheme('matrix')} className={`p-2 rounded border flex justify-center items-center h-10 bg-black text-green-500 ${theme === 'matrix' ? 'ring-2 ring-green-500' : ''}`} title="Matrix"><Terminal size={16} /></button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-7xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

                        <div className="lg:col-span-5 space-y-4 overflow-y-auto h-full pb-20">

                            <div className={`flex rounded-lg shadow p-1 border ${theme === 'dark' || theme === 'rgb' ? 'bg-slate-800 border-slate-700' : theme === 'matrix' ? 'bg-black border-green-800' : 'bg-white border-gray-200'}`}>
                                <button
                                    onClick={() => handleModeChange('parts')}
                                    className={`flex-1 py-2 rounded-md font-medium text-sm flex items-center justify-center gap-2 transition-all ${mode === 'parts' ? (theme === 'matrix' ? 'bg-green-900 text-green-200' : 'bg-blue-100 text-blue-700') : 'opacity-70 hover:opacity-100'}`}
                                >
                                    <Box size={16} /> 1. อุปกรณ์
                                </button>
                                <button
                                    onClick={() => handleModeChange('cables')}
                                    className={`flex-1 py-2 rounded-md font-medium text-sm flex items-center justify-center gap-2 transition-all ${mode === 'cables' ? (theme === 'matrix' ? 'bg-green-900 text-green-200' : 'bg-yellow-100 text-yellow-700') : 'opacity-70 hover:opacity-100'}`}
                                >
                                    <Cable size={16} /> 2. สายไฟ
                                </button>
                                <button
                                    onClick={() => handleModeChange('os')}
                                    className={`flex-1 py-2 rounded-md font-medium text-sm flex items-center justify-center gap-2 transition-all ${mode === 'os' ? (theme === 'matrix' ? 'bg-green-900 text-green-200' : 'bg-purple-100 text-purple-700') : 'opacity-70 hover:opacity-100'}`}
                                >
                                    <Monitor size={16} /> 3. Windows
                                </button>
                            </div>

                            {mode === 'parts' && (
                                <div className="space-y-4">
                                    {partCategories.map((cat) => {
                                        let items = PARTS_DATA[cat.source] || [];
                                        if (cat.filter) items = items.filter(cat.filter);
                                        return (
                                            <div key={cat.key} className={`rounded-xl shadow-sm p-4 border transition-colors ${getCardClass()}`}>
                                                <div className="flex items-center gap-2 mb-3 font-semibold border-b pb-2 opacity-90">
                                                    {cat.icon} {cat.label}
                                                </div>
                                                <div className="grid grid-cols-1 gap-2">
                                                    {items.map((part) => {
                                                        const { compatible, reason } = checkCompatibility(cat.key, part);
                                                        const isSelected = build[cat.key] === part.id;
                                                        return (
                                                            <button
                                                                key={part.id}
                                                                onClick={() => compatible && handleSelectPart(cat.key, part.id)}
                                                                disabled={!compatible}
                                                                className={`text-left p-3 rounded-lg border flex justify-between items-center transition-all ${!compatible ? 'opacity-40 cursor-not-allowed' :
                                                                    isSelected
                                                                        ? (theme === 'matrix' ? 'border-green-500 bg-green-900/30' : 'border-blue-500 bg-blue-50/50 ring-1 ring-blue-500')
                                                                        : (theme === 'dark' || theme === 'rgb' ? 'border-gray-700 hover:bg-white/5' : theme === 'matrix' ? 'border-green-900 hover:bg-green-900/20' : 'border-gray-200 hover:border-blue-300 hover:bg-gray-50')
                                                                    }`}
                                                            >
                                                                <div>
                                                                    <div className="font-medium text-sm flex items-center gap-2">
                                                                        {part.name}
                                                                        {!compatible && <span className="text-xs text-red-500 bg-red-100 px-1 rounded flex items-center gap-1"><Lock size={10} /> {reason}</span>}
                                                                    </div>
                                                                    {part.type && <div className="text-xs opacity-60 capitalize">{part.type}</div>}
                                                                </div>
                                                                <div className={`text-sm font-bold ${theme === 'matrix' ? 'text-green-400' : 'text-blue-600'}`}>฿{part.price.toLocaleString()}</div>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {mode === 'cables' && (
                                <div className={`rounded-xl shadow-sm p-6 border text-center transition-colors ${getCardClass()}`}>
                                    <Cable className={`w-12 h-12 mx-auto mb-4 ${theme === 'matrix' ? 'text-green-500' : 'text-yellow-500'}`} />
                                    <h3 className="text-lg font-bold mb-2">โหมดเดินสายไฟ (Cabling)</h3>
                                    <p className="text-sm opacity-70 mb-4">
                                        ลากหัวต่อสายไฟ จากด้านล่างหรือด้านข้าง ไปยังจุดเชื่อมต่อบนเมนบอร์ดที่มีแสงกระพริบ
                                    </p>
                                    <div className={`text-left text-sm space-y-2 p-4 rounded-lg ${theme === 'dark' || theme === 'rgb' ? 'bg-black/20' : theme === 'matrix' ? 'bg-green-900/10 border border-green-800' : 'bg-gray-50'}`}>
                                        <div className="font-semibold opacity-90">รายการสายที่ต้องต่อ:</div>
                                        <ul className="list-disc pl-5 space-y-1 opacity-80">
                                            <li className={cableStatus['atx24'] ? 'text-green-500 line-through' : ''}>24-Pin Main (ไฟเลี้ยงบอร์ด)</li>
                                            <li className={cableStatus['eps8'] ? 'text-green-500 line-through' : ''}>8-Pin CPU (ไฟเลี้ยงซีพียู)</li>
                                            <li className={cableStatus['frontPanel'] ? 'text-green-500 line-through' : ''}>Front Panel (ปุ่มเปิดเครื่อง)</li>
                                            {build.gpu && build.gpu !== 'gpu0' && <li className={cableStatus['gpuPcie'] ? 'text-green-500 line-through' : ''}>PCIe Power (ไฟการ์ดจอ)</li>}
                                            {build.hdd1 && <li className={cableStatus['sata1'] ? 'text-green-500 line-through' : ''}>SATA Data 1</li>}
                                            {build.hdd2 && <li className={cableStatus['sata2'] ? 'text-green-500 line-through' : ''}>SATA Data 2</li>}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {mode === 'os' && (
                                <div className={`rounded-xl shadow-sm p-6 border text-center transition-colors ${getCardClass()}`}>
                                    <Monitor className={`w-12 h-12 mx-auto mb-4 ${theme === 'matrix' ? 'text-green-500' : 'text-purple-500'}`} />
                                    <h3 className="text-lg font-bold mb-2">โหมดลงโปรแกรม (OS Setup)</h3>
                                    <p className="text-sm opacity-70 mb-4">
                                        จำลองการเปิดเครื่องและติดตั้ง Windows 11 ผ่าน USB
                                    </p>
                                    <div className={`text-left text-sm space-y-2 p-4 rounded-lg border ${theme === 'dark' || theme === 'rgb' ? 'bg-black/20 border-white/10' : theme === 'matrix' ? 'bg-green-900/10 border-green-800 text-green-300' : 'bg-purple-50 border-purple-100 text-purple-800'}`}>
                                        <div className="font-semibold">ขั้นตอนการเล่น:</div>
                                        <ol className="list-decimal pl-5 space-y-1 opacity-80">
                                            <li>เสียบ USB Flash Drive (คลิกปุ่ม)</li>
                                            <li>กดปุ่มเปิดเครื่อง (Power On)</li>
                                            <li>รอหน้า BIOS POST ตรวจสอบอุปกรณ์</li>
                                            <li>กด Install Now ในหน้า Windows Setup</li>
                                            <li>เลือก Drive ที่ต้องการลง Windows</li>
                                            <li>รอการติดตั้งเสร็จสมบูรณ์</li>
                                        </ol>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="lg:col-span-7">
                            <div className="sticky top-24">
                                <h2 className="text-xl font-bold mb-4 flex items-center gap-2 opacity-90">
                                    <Monitor />
                                    {mode === 'parts' && 'ภาพจำลองการประกอบ'}
                                    {mode === 'cables' && 'ภาพจำลองการเดินสายไฟ'}
                                    {mode === 'os' && 'หน้าจอมอนิเตอร์'}
                                </h2>

                                {mode !== 'os' ? (
                                    <PCVisualizer
                                        build={build}
                                        cableStatus={cableStatus}
                                        onConnectCable={handleConnectCable}
                                        isCablingMode={mode === 'cables'}
                                        theme={theme}
                                    />
                                ) : (
                                    <OSSimulator
                                        build={build}
                                        userName={userInfo.name}
                                        onComplete={handleFinishGame}
                                    />
                                )}

                                {mode === 'cables' && (
                                    <div className={`mt-4 flex items-center gap-2 text-sm p-3 rounded-lg border ${theme === 'matrix' ? 'bg-green-900/20 border-green-800 text-green-400' : 'bg-yellow-50 border-yellow-200 text-yellow-700'}`}>
                                        <MousePointer2 size={16} />
                                        <span>Tip: ใช้เมาส์หรือนิ้วลากหัวต่อสีเหลืองไปยังจุดที่มีไฟกระพริบ</span>
                                    </div>
                                )}
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PCBuilderGame />);
    </script>
</body>

</html>
